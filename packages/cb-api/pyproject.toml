[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cb-api"
version = "0.1.0"
description = "Cookiebot v2 API — replaces the Java/Spring Boot + MongoDB backend"
requires-python = ">=3.13"
dependencies = [
    "cb-core",
    "fastapi>=0.115",
    "granian>=1.7",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "alembic>=1.14",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    # x_webhub_login. v1 used PyJWT for the token and jwcrypto for the key;
    # `cryptography` (PyJWT's own extra) covers both, so this is one dependency
    # rather than two.
    "pyjwt[crypto]>=2.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
