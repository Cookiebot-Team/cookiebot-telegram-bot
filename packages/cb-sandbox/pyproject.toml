[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cb-sandbox"
version = "0.1.0"
description = "A local Telegram for testing bots: a real Bot API surface, a control plane, and a pytest test kit"
requires-python = ">=3.13"
# Deliberately no dependency on any host application. Everything that used to
# be a fact about one particular bot — identity, seeds, features, commands —
# is data in `sandbox.config.json`; see `cb_sandbox/config.py`.
dependencies = [
    "fastapi>=0.115",
    "granian>=1.7",
    # Starlette needs this to parse the multipart bodies aiogram sends; without it
    # `Request.form()` asserts unconditionally.
    "python-multipart>=0.0.20",
    # The sandbox's durable copy of its world — see persistence.py.
    "duckdb>=1.1",
    # The test kit's HTTP client. Sync, small, and already present anywhere
    # FastAPI's own TestClient is, so this adds nothing in practice.
    "httpx>=0.27",
]

[project.optional-dependencies]
# Structured logging, if the host wants it. `cb_sandbox/logging.py` falls back
# to the standard library when it is absent, so this is genuinely optional.
log = ["structlog>=24"]

[project.entry-points.pytest11]
# Installing this package gives any pytest suite the `sandbox`, `sandbox_kit`
# and `sandbox_scenario` fixtures with no conftest wiring — see
# `cb_sandbox/testkit/plugin.py`.
cb_sandbox = "cb_sandbox.testkit.plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
