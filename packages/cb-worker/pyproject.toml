[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cb-worker"
version = "0.1.0"
description = "Async jobs — media, AI, fan-out, partition maintenance, rollups"
requires-python = ">=3.13"
dependencies = [
    "cb-core",
    "arq>=0.26",
    "aiogram>=3.17",
    # Mongo -> Citus import (cb_worker/importer). pymongo also ships `bson`, which
    # is what reads a `mongodump` directory, so one dependency covers both the
    # live-server and the backup-file source.
    "pymongo>=4.10",
    # Cutover bucket export (cb_worker/bucket_export). The *destination* side goes
    # through cb_core.storage (obstore) like everything else — this is only for
    # the *source* read, v1's own GCS bucket, which obstore has no scope-
    # restriction knob for. google-auth is what mints the read-only-scoped OAuth
    # token (see bucket_export/source.py); google-cloud-storage is what carries it
    # on every request. Same "direct SDK for a foreign source" precedent as
    # pymongo above, not a second way to write our own storage.
    "google-cloud-storage>=3.13",
    # Per-prefix progress bars and the final copied/skipped/failed summary table.
    "rich>=13.7",
    # util_birthday's collage compositing (cb_worker/collage.py). v1 used
    # OpenCV for this one grid-of-photos-plus-one-alpha-overlay job; nothing
    # else in this codebase does pixel compositing, so Pillow — C-backed,
    # much smaller surface than OpenCV — is the new dependency, not a
    # duplicate of one already present (AGENTS.md §5).
    "Pillow>=11.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
