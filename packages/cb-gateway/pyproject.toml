[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cb-gateway"
version = "0.1.0"
description = "Telegram ingest — aiogram 3 webhook, stateless, multi-skin"
requires-python = ">=3.13"
dependencies = [
    "cb-core",
    "aiogram>=3.17",
    "fastapi>=0.115",
    "granian>=1.7",
    "arq>=0.26",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
