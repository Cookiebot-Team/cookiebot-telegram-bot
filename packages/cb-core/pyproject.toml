[build-system]
requires = ["setuptools>=75", "Cython>=3.0.11"]
build-backend = "setuptools.build_meta"

[project]
name = "cb-core"
version = "0.1.0"
description = "Shared runtime: settings, telemetry, db, cache, and the Cython-compiled hot path"
requires-python = ">=3.13"
dependencies = [
    # rust-backed
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "orjson>=3.10",
    "msgspec>=0.19",
    "blake3>=1.0",
    "uuid-utils>=0.10",
    "whenever>=0.6",
    "polars>=1.20",
    # object storage: one Rust crate (`object_store`) behind S3, GCS, local and memory
    "obstore>=0.11",
    # c-backed
    "asyncpg>=0.30",
    # DDL only: every service converges the schema at startup (cb_core/migrations.py),
    # so the runner has to live where all of them can reach it. Runtime SQL stays asyncpg.
    "alembic>=1.14",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "uvloop>=0.21; sys_platform != 'win32'",
    "redis[hiredis]>=5.2",
    "zstandard>=0.23",
    # observability
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-grpc>=1.29",
    "opentelemetry-instrumentation-asyncpg>=0.50b0",
    "opentelemetry-instrumentation-redis>=0.50b0",
    "opentelemetry-instrumentation-httpx>=0.50b0",
    "prometheus-client>=0.21",
    "structlog>=25.1",
    # http
    "httpx[http2]>=0.28",
    # util_postforwarder: v1 parses ad prices with this exact library
    # (Publisher.py:12,138). Pure Python, no transitive deps, and the one thing
    # this port must not reimplement — its symbol/amount/locale handling is what
    # decides the converted number in every ad caption.
    "price-parser>=0.4",
    # llm providers
    "anthropic>=0.120",
    "openai>=2.0",
    # multi-provider routing via `init_chat_model` — see llm/langchain_provider.py
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.3",
    # pure-python mode shadow module; the compiled .so does not need it at runtime,
    # but the uncompiled fallback import does.
    "Cython>=3.0.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
# v1 locale strings ported verbatim (see cb_core/locales.py); read via
# importlib.resources so they must ship inside the wheel, not just the sdist.
"cb_core.locale_data.en" = ["*.txt", "*.json"]
"cb_core.locale_data.pt" = ["*.txt", "*.json"]
"cb_core.locale_data.es" = ["*.txt", "*.json"]
# v1 static media ported verbatim (see cb_core/assets.py); same reason as
# locale_data above — importlib.resources needs it inside the wheel.
"cb_core.asset_data.complaint" = ["*.jpg", "*.wav"]
"cb_core.asset_data.birthday" = ["*.jpg", "*.png"]
# fun_meme's template *metadata* only (97 kB of CSV). The 110 MB of templates
# it describes live in cb_core.storage, seeded by `cb.py meme-seed` — see
# cb_core/meme_templates.py for why the split is where it is.
"cb_core.asset_data.meme" = ["*.csv"]
# core_botskins: v1's join-time flair, and the per-skin override tree that
# rebrands it (cb_core/skins.py). The `skins.*` glob covers a skin pack's own
# subdirectories, which is what makes adding a brand a directory rather than
# a packaging change.
"cb_core.asset_data.doomlist" = ["*.jpg"]
"cb_core.asset_data.skins" = ["*/*", "*/*/*"]
# cb_core/legacy_assets.py: `bucket_export`'s cutover manifest, regrouped by
# `cb.py legacy-catalog` into one small CSV per v1 prefix. Empty in a fresh
# checkout (see cb_core/asset_data/legacy/__init__.py) until that generator
# has run against a finished bucket-export manifest. `*/*.csv` covers
# `Countdown/*`, `Fight/*` and `Custom/<command>`'s one level of nesting.
"cb_core.asset_data.legacy" = ["*.csv", "*/*.csv"]
# x_image_search's blocklist, v1's Static/avoid_search.txt byte-for-byte
# (cb_core/image_search.py). Read through importlib.resources like the locale
# catalogs, so it has to be in the wheel.
"cb_core.asset_data.search" = ["*.txt"]
