{{- if .Values.citus.enabled }}
{{/*
PostgreSQL 17 + Citus 13, managed by CloudNativePG. The operator is a cluster
concern and is NOT installed here — this only creates the Cluster CR.

Coordinator-only is not a compromise: create_distributed_table(), colocation,
reference tables and pg_cron rollups all work on one node; the shards live
locally. The group_id shard key from docs/MULTI-TENANT.md is unchanged, and
adding workers later is citus_add_node(), not a migration.
*/}}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "cookiebot.fullname" . }}-citus
  labels:
    {{- include "cookiebot.labels" . | nindent 4 }}
  annotations:
    # Citus rewrites parts of its own configuration after CREATE EXTENSION.
    argocd.argoproj.io/sync-options: ServerSideApply=true
spec:
  instances: {{ .Values.citus.instances }}
  imageName: {{ .Values.citus.image }}
  primaryUpdateStrategy: unsupervised

  postgresql:
    # Citus registers the coordinator in pg_dist_node as localhost:5432 and
    # reaches its own shards over a real TCP connection even when every shard
    # is local. That connection carries no password and CloudNativePG's
    # generated pg_hba ends at `host all all all scram-sha-256`, so without
    # this every distributed write fails:
    #
    #   WARNING: could not connect to shard "…" on node "localhost:5432"
    #   ERROR:   could not commit transaction for shard … on at least one active node
    #
    # A plain initdb leaves loopback on trust, which is why this only bites
    # under CNPG. The scope is one pod's own network namespace.
    pg_hba:
      - host all all 127.0.0.1/32 trust
      - host all all ::1/128 trust

    # citus and pg_stat_statements are always preloaded. Anything else that
    # registers a background worker — pg_durable, pg_cron — has to be listed
    # too, and the failure if it is not is quiet: CREATE EXTENSION succeeds and
    # the worker never runs.
    shared_preload_libraries:
      - citus
      - pg_stat_statements
      {{- range .Values.citus.extraPreloadLibraries }}
      - {{ . }}
      {{- end }}
    parameters:
      {{- toYaml .Values.citus.parameters | nindent 6 }}

  bootstrap:
    initdb:
      database: {{ .Values.citus.database }}
      owner: {{ .Values.citus.owner }}
      # No postInitTemplateSQL. Creating the citus extension in template1
      # starts Citus's maintenance daemon against template1, and CNPG's very
      # next bootstrap step is CREATE DATABASE … TEMPLATE template1, which
      # fails while any session holds it open:
      #
      #   ERROR: source database "template1" is being accessed by other users
      #
      # Measured on this image: 9 of 10 back-to-back attempts blocked. Being a
      # race it fails most of the time and succeeds occasionally, which is the
      # worst way for a bootstrap to behave.
      #
      # No postInitApplicationSQL either — CNPG runs it as the application
      # owner, and these extensions write to pg_catalog:
      #
      #   ERROR: permission denied to create "pg_catalog.pg_stat_statements"
      #
      # The Database resource below is reconciled by the operator as a
      # superuser, which is the only one of the three that works.

  storage:
    size: {{ .Values.citus.storage.size }}
    {{- with .Values.citus.storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}

  walStorage:
    size: {{ .Values.citus.walStorage.size }}
    {{- with .Values.citus.walStorage.storageClass }}
    storageClass: {{ . }}
    {{- end }}

  resources:
    {{- toYaml .Values.citus.resources | nindent 4 }}

  # CNPG runs a Postgres exporter on 9187 in every instance pod. Annotation
  # based scraping reads POD annotations, so they have to reach the pods —
  # inheritedMetadata is how CNPG propagates them.
  inheritedMetadata:
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9187"
    labels:
      {{- include "cookiebot.labels" . | nindent 6 }}

  monitoring:
    enablePodMonitor: false # scraped by annotation, not by PodMonitor
    {{- if .Values.citus.metrics.enabled }}
    # Query, IO, lock and per-table statistics on top of CNPG's own `cnpg_*`
    # series. See the header of templates/citus-metrics.yaml for what each query
    # answers and why its cardinality is bounded the way it is.
    customQueriesConfigMap:
      - name: {{ include "cookiebot.fullname" . }}-citus-queries
        key: queries.yaml
    {{- end }}

  {{- if .Values.citus.backup.enabled }}
  backup:
    barmanObjectStore:
      destinationPath: {{ .Values.citus.backup.destinationPath }}
      {{- with .Values.citus.backup.endpointURL }}
      endpointURL: {{ . }}
      {{- end }}
      s3Credentials:
        accessKeyId:
          name: {{ .Values.citus.backup.credentialsSecret }}
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: {{ .Values.citus.backup.credentialsSecret }}
          key: ACCESS_SECRET_KEY
    retentionPolicy: {{ .Values.citus.backup.retention | quote }}
  {{- end }}
---
# The Database resource carries the extensions. It is applied by the operator
# as a superuser, and re-applied whenever its spec changes — postInit SQL runs
# once at bootstrap, so an extension added to it later is an edit that appears
# to work and does nothing. Note that `applied: true` in its status is a record
# of a past action, not a live assertion: the controller acts on a generation
# change and does not re-verify.
#
# There is no metrics Service any more. The one that used to be here selected
# `role: primary`, a label CloudNativePG replaced with cnpg.io/instanceRole, so
# it matched no endpoints — and it was annotated for scraping where nothing
# reads Service annotations.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ include "cookiebot.fullname" . }}-citus-db
  labels:
    {{- include "cookiebot.labels" . | nindent 4 }}
spec:
  cluster:
    name: {{ include "cookiebot.fullname" . }}-citus
  name: {{ .Values.citus.database }}
  owner: {{ .Values.citus.owner }}
  ensure: present
  # A prune or a rename must not drop the database.
  databaseReclaimPolicy: retain
  extensions:
    - name: citus
      ensure: present
    - name: pg_stat_statements
      ensure: present
{{- range .Values.citus.extraExtensions }}
    - name: {{ . }}
      ensure: present
{{- end }}
{{- end }}
