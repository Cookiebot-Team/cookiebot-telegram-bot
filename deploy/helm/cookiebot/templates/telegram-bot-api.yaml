{{- if .Values.telegramBotApi.enabled }}
{{/*
Self-hosted Telegram Bot API server.

Two things it buys, both of which the v1 stack paid for in workarounds:
  * --local permits an http:// webhook on a private address, so the whole
    ingest path stays inside the cluster — no public hostname, no tunnel entry
  * no download size cap and 2 GB uploads, and getFile returns a local path the
    worker reads off the shared volume instead of re-downloading

Prerequisite the chart cannot enforce: the bot must be logged OUT of
api.telegram.org first. Telegram gives no delivery guarantee otherwise, and
refuses logOut while a webhook is set.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cookiebot.fullname" . }}-telegram-bot-api
  labels:
    {{- include "cookiebot.labels" . | nindent 4 }}
    app.kubernetes.io/name: telegram-bot-api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: {{ .Values.telegramBotApi.statsPort | quote }}
    prometheus.io/path: /
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: telegram-bot-api
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.telegramBotApi.port }}
      targetPort: http
    - name: stats
      port: {{ .Values.telegramBotApi.statsPort }}
      targetPort: stats
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "cookiebot.fullname" . }}-telegram-bot-api
  labels:
    {{- include "cookiebot.labels" . | nindent 4 }}
    app.kubernetes.io/name: telegram-bot-api
spec:
  serviceName: {{ include "cookiebot.fullname" . }}-telegram-bot-api
  # A bot may be logged in on exactly one server at a time. Two replicas would
  # fight over the session, not share it.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: telegram-bot-api
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "cookiebot.labels" . | nindent 8 }}
        app.kubernetes.io/name: telegram-bot-api
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      # Starts as root and drops to uid 101 on its own: the entrypoint always
      # appends --username/--groupname, and the server calls setgroups/setuid
      # early in startup. Forcing runAsNonRoot instead produces
      #
      #   Can't change effective user: Failed to clear supplementary group list
      #
      # followed by the usage text and an exit. The process spends only its
      # first moments as root, and the capability set is cut to the three
      # things it uses to get there.
      securityContext:
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: telegram-bot-api
          image: {{ .Values.telegramBotApi.image }}
          # NO args. The image's entrypoint builds the command line itself from
          # TELEGRAM_* environment variables and ends with `exec $COMMAND` —
          # it never passes "$@" through, so anything given here is discarded
          # in silence. That included --local, which is the entire reason this
          # server exists: without it Telegram refuses an http:// webhook on a
          # private address and the ingest path quietly becomes the cloud API.
          # The pod ran, the port answered, and the flag was never applied.
          env:
            - name: TELEGRAM_LOCAL
              value: {{ .Values.telegramBotApi.local | quote }}
            - name: TELEGRAM_HTTP_PORT
              value: {{ .Values.telegramBotApi.port | quote }}
            - name: TELEGRAM_STAT
              value: "true"
            - name: TELEGRAM_WORK_DIR
              value: {{ .Values.telegramBotApi.filesRoot | quote }}
            - name: TELEGRAM_TEMP_DIR
              value: {{ printf "%s/tmp" .Values.telegramBotApi.filesRoot | quote }}
            - name: TELEGRAM_VERBOSITY
              value: "1"
            - name: TELEGRAM_API_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: telegram-api-id
            - name: TELEGRAM_API_HASH
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: telegram-api-hash
          ports:
            - name: http
              containerPort: {{ .Values.telegramBotApi.port }}
            - name: stats
              containerPort: {{ .Values.telegramBotApi.statsPort }}
          readinessProbe:
            # The stats port answers as soon as the server listens; the bot port
            # only answers to a path containing a valid token.
            tcpSocket:
              port: stats
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            {{- toYaml .Values.telegramBotApi.resources | nindent 12 }}
          # CHOWN for the work dir, SETUID and SETGID for the drop to uid 101.
          # Everything else is dropped, so root here is root with three
          # capabilities rather than root with all of them.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "SETUID", "SETGID"]
          volumeMounts:
            - name: data
              mountPath: {{ .Values.telegramBotApi.filesRoot }}
      {{- if not .Values.telegramBotApi.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.telegramBotApi.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.telegramBotApi.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.telegramBotApi.persistence.size }}
  {{- end }}
{{- end }}
