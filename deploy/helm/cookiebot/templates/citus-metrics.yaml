{{- if and .Values.citus.enabled .Values.citus.metrics.enabled }}
{{/*
Deep PostgreSQL metrics, through CloudNativePG's own exporter.

CNPG already publishes `cnpg_*` on 9187 — connections, transactions, WAL,
checkpoints, database size. What it does not publish is anything about the
*queries*: which statements the database spends its time in, how much of the IO
is data-file reads versus cache hits, what is waiting on what. That is the half
you need when the answer to "why was that slow" is not "the disk".

These run inside the instance manager's existing scrape, as `postgres`, on the
connection it already holds. No sidecar, no second scrape target, no second
monitoring stack: the alternative considered was PMM Server, which brings its
own Grafana, VictoriaMetrics and ClickHouse to a single node whose memory limits
are already oversubscribed, to answer questions this answers.

Cardinality is bounded deliberately. `cb_statements` is the only query with a
label that varies with workload (`queryid`), and it is capped at the top 20 by
total execution time — enough to name what a database is spending itself on,
small enough that the series set does not grow with traffic. Everything else is
grouped by a fixed domain: backend type, wait event type, lock mode.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cookiebot.fullname" . }}-citus-queries
  labels:
    {{- include "cookiebot.labels" . | nindent 4 }}
data:
  queries.yaml: |
    # Where the time goes. Top 20 statements by cumulative execution time, which
    # is the ranking that finds both "slow and rare" and "fast and constant" —
    # the second is what a 500k-call background poller looks like.
    #
    # GROUP BY queryid is not cosmetic. `pg_stat_statements` holds one row per
    # (userid, dbid, queryid, toplevel), so the same statement appears several
    # times — and two rows reduced to the same labels make the exporter fail the
    # *entire* scrape with "collected metric ... was collected before with the
    # same name and label values". Not this query's metrics: all of them,
    # including every built-in `cnpg_*` series the alerts depend on. One
    # careless label set takes the whole endpoint down.
    cb_statements:
      query: |
        SELECT queryid::text AS queryid,
               min(left(regexp_replace(query, '\s+', ' ', 'g'), 100)) AS query,
               sum(calls) AS calls,
               sum(total_exec_time) / 1000.0 AS seconds_total,
               sum(total_exec_time) / (1000.0 * greatest(sum(calls), 1)) AS seconds_mean,
               max(max_exec_time) / 1000.0 AS seconds_max,
               sum(rows) AS rows,
               sum(shared_blks_hit) AS blocks_hit,
               sum(shared_blks_read) AS blocks_read,
               sum(temp_blks_written) AS temp_blocks_written,
               sum(wal_bytes) AS wal_bytes
        FROM pg_stat_statements
        WHERE query NOT LIKE '%pg_stat_statements%'
        GROUP BY queryid
        ORDER BY sum(total_exec_time) DESC
        LIMIT 20
      target_databases: [{{ .Values.citus.database | quote }}]
      metrics:
        - queryid: {usage: LABEL, description: pg_stat_statements identifier}
        - query: {usage: LABEL, description: first 100 characters of the normalised statement}
        - calls: {usage: COUNTER, description: times this statement has been executed}
        - seconds_total: {usage: COUNTER, description: cumulative execution time}
        - seconds_mean: {usage: GAUGE, description: mean execution time}
        - seconds_max: {usage: GAUGE, description: slowest single execution}
        - rows: {usage: COUNTER, description: rows returned or affected}
        - blocks_hit: {usage: COUNTER, description: blocks served from shared buffers}
        - blocks_read: {usage: COUNTER, description: blocks read from disk or OS cache}
        - temp_blocks_written: {usage: COUNTER, description: blocks spilled to temporary files}
        - wal_bytes: {usage: COUNTER, description: WAL generated by this statement}

    # The same table, with no labels: totals you can alert on, and the two counts
    # that say whether anything is pathological rather than merely busy.
    cb_statements_summary:
      query: |
        SELECT sum(calls) AS calls,
               sum(total_exec_time) / 1000.0 AS seconds,
               sum(rows) AS rows,
               count(*) AS statements,
               count(*) FILTER (WHERE mean_exec_time > 500) AS slow_statements,
               count(*) FILTER (WHERE max_exec_time > 5000) AS very_slow_statements,
               EXTRACT(EPOCH FROM (now() - min(stats_since))) AS window_seconds
        FROM pg_stat_statements
      target_databases: [{{ .Values.citus.database | quote }}]
      metrics:
        - calls: {usage: COUNTER, description: statements executed since the last reset}
        - seconds: {usage: COUNTER, description: cumulative execution time of all statements}
        - rows: {usage: COUNTER, description: rows returned or affected by all statements}
        - statements: {usage: GAUGE, description: distinct normalised statements tracked}
        - slow_statements: {usage: GAUGE, description: statements averaging over 500ms}
        - very_slow_statements: {usage: GAUGE, description: statements that have taken over 5s at least once}
        - window_seconds: {usage: GAUGE, description: age of the oldest statistics entry}

    # Where the IO goes, from pg_stat_io (PostgreSQL 16+). `context=normal` on
    # relations is ordinary data-file traffic; `bulkread`/`bulkwrite` is a seq
    # scan or a COPY; `vacuum` is autovacuum's own. `hits` against `reads` is the
    # buffer cache doing its job, per backend type rather than for the server as
    # a whole — which is what separates "the application is missing cache" from
    # "autovacuum is".
    cb_io:
      query: |
        SELECT backend_type,
               coalesce(object, 'unknown') AS object,
               context,
               coalesce(reads, 0) AS reads,
               coalesce(writes, 0) AS writes,
               coalesce(extends, 0) AS extends,
               coalesce(hits, 0) AS hits,
               coalesce(evictions, 0) AS evictions,
               coalesce(fsyncs, 0) AS fsyncs,
               coalesce(read_time, 0) / 1000.0 AS read_seconds,
               coalesce(write_time, 0) / 1000.0 AS write_seconds
        FROM pg_stat_io
        WHERE coalesce(reads, 0) + coalesce(writes, 0) + coalesce(hits, 0) + coalesce(extends, 0) > 0
      target_databases: [{{ .Values.citus.database | quote }}]
      metrics:
        - backend_type: {usage: LABEL, description: which kind of process did the IO}
        - object: {usage: LABEL, description: relation or temp relation}
        - context: {usage: LABEL, description: normal, vacuum, bulkread or bulkwrite}
        - reads: {usage: COUNTER, description: blocks read}
        - writes: {usage: COUNTER, description: blocks written}
        - extends: {usage: COUNTER, description: relation extensions}
        - hits: {usage: COUNTER, description: blocks found already in shared buffers}
        - evictions: {usage: COUNTER, description: buffers evicted to make room}
        - fsyncs: {usage: COUNTER, description: fsync calls}
        - read_seconds: {usage: COUNTER, description: time spent reading}
        - write_seconds: {usage: COUNTER, description: time spent writing}

    # Who is connected and what they are waiting on. `wait_event_type` is the
    # difference between a database that is busy and one that is blocked.
    cb_activity:
      query: |
        SELECT coalesce(state, 'unknown') AS state,
               coalesce(wait_event_type, 'none') AS wait_event_type,
               count(*) AS connections,
               coalesce(max(EXTRACT(EPOCH FROM (now() - xact_start))), 0) AS oldest_transaction_seconds,
               coalesce(max(EXTRACT(EPOCH FROM (now() - query_start))), 0) AS oldest_query_seconds
        FROM pg_stat_activity
        WHERE datname IS NOT NULL
        GROUP BY 1, 2
      target_databases: [{{ .Values.citus.database | quote }}]
      metrics:
        - state: {usage: LABEL, description: active, idle, idle in transaction}
        - wait_event_type: {usage: LABEL, description: what the backend is waiting on}
        - connections: {usage: GAUGE, description: backends in this state}
        - oldest_transaction_seconds: {usage: GAUGE, description: age of the oldest transaction in this state}
        - oldest_query_seconds: {usage: GAUGE, description: age of the oldest running query in this state}

    # Locks by mode, and the ones not granted. Citus commits cross-shard writes
    # with two-phase commit, so contention here is not always a long query —
    # it can be a prepared transaction nobody resolved.
    cb_locks:
      query: |
        SELECT mode,
               count(*) AS held,
               count(*) FILTER (WHERE NOT granted) AS waiting
        FROM pg_locks
        WHERE mode IS NOT NULL
        GROUP BY 1
      target_databases: [{{ .Values.citus.database | quote }}]
      metrics:
        - mode: {usage: LABEL, description: lock mode}
        - held: {usage: GAUGE, description: locks in this mode}
        - waiting: {usage: GAUGE, description: locks in this mode not yet granted}

    # Per logical table, with the shards summed back together. Citus spreads one
    # table over 32 shard relations, so raw pg_stat_user_tables answers every
    # question 32 times and none of them usefully. Stripping the shard suffix is
    # what makes "which table is being sequentially scanned" answerable again.
    cb_tables:
      query: |
        SELECT regexp_replace(relname, '_[0-9]+$', '') AS logical_table,
               sum(seq_scan) AS seq_scans,
               sum(coalesce(idx_scan, 0)) AS index_scans,
               sum(n_live_tup) AS live_tuples,
               sum(n_dead_tup) AS dead_tuples,
               sum(n_tup_ins) AS tuples_inserted,
               sum(n_tup_upd) AS tuples_updated,
               sum(n_tup_del) AS tuples_deleted,
               sum(pg_total_relation_size(relid)) AS bytes
        FROM pg_stat_user_tables
        GROUP BY 1
        ORDER BY 9 DESC
        LIMIT 20
      target_databases: [{{ .Values.citus.database | quote }}]
      metrics:
        - logical_table: {usage: LABEL, description: table name with the Citus shard suffix removed}
        - seq_scans: {usage: COUNTER, description: sequential scans across every shard}
        - index_scans: {usage: COUNTER, description: index scans across every shard}
        - live_tuples: {usage: GAUGE, description: estimated live rows}
        - dead_tuples: {usage: GAUGE, description: estimated dead rows awaiting vacuum}
        - tuples_inserted: {usage: COUNTER, description: rows inserted}
        - tuples_updated: {usage: COUNTER, description: rows updated}
        - tuples_deleted: {usage: COUNTER, description: rows deleted}
        - bytes: {usage: GAUGE, description: total size including indexes and toast}

    # The shape of the cluster itself. A shard count that changes is a rebalance
    # or a new distributed table; a node count that changes on a single-node
    # deployment is a surprise worth seeing.
    cb_citus:
      query: |
        SELECT count(*) FILTER (WHERE partmethod = 'h') AS distributed_tables,
               count(*) FILTER (WHERE partmethod = 'n') AS reference_tables,
               (SELECT count(*) FROM pg_dist_shard) AS shards,
               (SELECT count(*) FROM pg_dist_node) AS nodes
        FROM pg_dist_partition
      target_databases: [{{ .Values.citus.database | quote }}]
      metrics:
        - distributed_tables: {usage: GAUGE, description: hash-distributed tables}
        - reference_tables: {usage: GAUGE, description: reference tables replicated to every node}
        - shards: {usage: GAUGE, description: shard placements}
        - nodes: {usage: GAUGE, description: nodes in the Citus cluster}
{{- end }}
