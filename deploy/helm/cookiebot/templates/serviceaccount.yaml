{{/*
The ServiceAccount every workload here names, created BEFORE the migrate Job.

It used to live at the bottom of service.yaml, which put it in the ordinary
sync phase. The migrate Job is a pre-install/PreSync hook, so it runs first —
and referenced an account that did not exist yet. Kubernetes admits the Job and
then never creates a pod for it:

  Error creating: pods "cookiebot-migrate-" is forbidden: error looking up
  service account cookiebot-uat/cookiebot: serviceaccount "cookiebot" not found

The sync then waits on a hook that can never complete, with no pod to look at.
It is a deadlock that only happens on a first install, which is why nothing had
hit it.

Making the account a hook of the same phase with a lower weight puts it ahead
of the Job in both Helm and Argo. There is deliberately no hook-delete-policy:
the long-running workloads use this account too, so deleting it when the hook
succeeds would break the thing it was created for.
*/}}
{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cookiebot.serviceAccountName" . }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-5"
  labels:
    {{- include "cookiebot.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Nothing in this chart talks to the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
