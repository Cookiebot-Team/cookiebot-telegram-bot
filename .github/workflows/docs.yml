name: Docs

# The board publishes the *committed* `content/progress.json`, and deliberately
# does not regenerate it here. A measurement is only worth publishing if it is
# complete, and this runner cannot produce a complete one: the v1 Gherkin lives
# in a separate private repository that is not checked out, and the acceptance
# suite needs Valkey. Measuring anyway published `0/0 specs covered` and 49
# "failing" scenarios that were connection errors — a dashboard that lies,
# which is the exact failure this site exists to prevent.
#
# So: `cb.py docs-sync` runs on a developer machine (where both are available),
# its output is committed, and every page states the commit and date it was
# measured from. What CI still enforces is the half it *can* verify without
# infrastructure — that no page's frontmatter disagrees with scripts/spec.py.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/spec.py'
      - 'scripts/status.py'
      - 'scripts/docs_sync.py'
      - 'qa/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/spec.py'
      - 'scripts/docs_sync.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: oven-sh/setup-bun@v2

      - name: Install Python workspace
        run: uv sync --all-packages

      - name: Frontmatter matches the spec
        # Spec-only: no database, no QA repo, no test run. Fails when someone
        # hand-edits a `status:` in an .mdx instead of `scripts/spec.py`.
        run: uv run python scripts/docs_sync.py --check --no-tests

      - name: Install docs dependencies
        working-directory: docs/site
        run: bun install --frozen-lockfile

      - name: Type-check
        working-directory: docs/site
        run: bun run types:check

      - name: Build static export
        working-directory: docs/site
        env:
          DOCS_BASE_PATH: /${{ github.event.repository.name }}
        run: bun run build

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/out

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
